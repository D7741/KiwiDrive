services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=KiwiDrive
      - Jwt__Audience=KiwiDriveUsers
      - Jwt__ExpiryDays=7

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - backend